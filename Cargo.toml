[package]
name = "rust-telegram"
version = "0.1.0"
edition = "2024"

[dependencies]
reqwest = { version = "0.12", features = ["json"] } # Enable JSON support
tokio = { version = "1", features = ["full"] }     # Required for async execution
serde = { version = "1", features = ["derive"] }    # For parsing data into structs
serde_with = "3.22.0"
